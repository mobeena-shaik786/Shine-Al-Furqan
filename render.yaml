# Render Blueprint — Shine Al Furqan API
# Docs: https://render.com/docs/blueprint-spec
#
# Prerequisites:
# 1. MongoDB Atlas cluster + connection string
# 2. SMTP credentials (production refuses MAIL_TRANSPORT=console)
# 3. Public frontend URL for CLIENT_URL (not localhost)

services:
  - type: web
    name: shine-al-furqan-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_START
        value: "false"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MAIL_TRANSPORT
        value: smtp
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
